
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" type="text/css" href="//maxcdn.bootstrapcdn.com/bootstrap/3.3.4/css/bootstrap.min.css" />
<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
<script type="text/javascript" src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.4/js/bootstrap.min.js"></script>

<style>
#div-container {
    position: relative; /* Establishes a positioning context for absolute children */
    top:      0;
    left:     0;
    width:    630px;
    height:   630px;
    border:   1px solid yellow;
}

#myCanvas {
    display:  block;              /* Helps with layout consistency */
    position: absolute;           /* Positioned relative to the container, sits underneath */
    top:      0;
    left:     0;
    border:   1px solid #000000;
    z-index:  10;                 /* Ensures the canvas has a specific stack order */
}

#savebuttonID {
    position: absolute;  /* Positioned relative to the container's top-left corner */
    top:      0px;       /* Example position (Y coordinate) */
    left:     650px;     /* Example position (X coordinate) */
    z-index:  10;        /* Ensures the widget appears above the canvas */
}

#loadbuttonID {
    position: absolute;  /* Positioned relative to the container's top-left corner */
    top:      30px;      /* Example position (Y coordinate) */
    left:     650px;     /* Example position (X coordinate) */
    z-index:  10;        /* Ensures the widget appears above the canvas */
}

#notesID {
    position: absolute;  /* Positioned relative to the container's top-left corner */
    top:      60px;      /* Example position (Y coordinate) */
    left:     650px;     /* Example position (X coordinate) */
    z-index:  10;        /* Ensures the widget appears above the canvas */
}
</style>
</head>
<body>
<div id="div-container">
<canvas width="630" height="630" id="myCanvas">Your browser does not support the HTML canvas tag.</canvas>
<input type="button"        id="savebuttonID"  onclick="SaveToTextFile();"  value="SAVE TO TEXT FILE">
<input type="button"        id="loadbuttonID"  onclick="document.getElementById('fileInputID').click();"  value="LOAD FROM TEXT FILE">
<textarea                   id="notesID" rows="20" cols="64"></textarea>
<input hidden type="file"   id="fileInputID"   accept=".txt">
<input hidden type="button" id="redrawfromtextareabuttonID"  onclick="RedrawMapsFromTextarea()"  value="REDRAW MAPS FROM TEXTAREA">
<input hidden type="button" id="printbuttonID" onclick="PrintToTextarea()"  value="PRINT TO TEXTAREA">
<textarea hidden            id="textareaID" rows="20" cols="64"></textarea>
</div>
<script>
var map_vertical = new Map();
var map_horizontal = new Map();

function DrawSpecialCharacters() {
	const canvas = document.getElementById('myCanvas');
	const ctx = canvas.getContext('2d');
	ctx.font = "26px Arial";

	var linearray = document.getElementById('notesID').value.split("\n");
        for (var ii=0; ii < linearray.length; ii++)
        {
		var chunkarray = linearray[ii].split("=");
		var dimensionarray = chunkarray[0].split(",");
		var xx = parseInt(dimensionarray[0], 10);
		var yy = parseInt(dimensionarray[1], 10);
		var character = chunkarray[1];
                var canvas_xx = ((xx+1)*30)+7;
                var canvas_yy = ((19 - yy + 1)*30)-7;

		console.log("xx=" + xx + " yy=" + yy + " character=" + character + " canvas_xx=" + canvas_xx + " canvas_yy=" + canvas_yy);

		ctx.fillText(character, canvas_xx, canvas_yy);
        }
}//DrawSpecialCharacters


function LoadLines_Vertical_Paint(vert_xx, vert_yy, value) {
     const canvas = document.getElementById('myCanvas');
     const ctx = canvas.getContext('2d');

     var start_yy = (19 - vert_yy)*30;

     if (value === "WALL") {
         var start_xx = ((vert_xx + 1) * 30) - 2;
         //console.log("LoadLines_Vertical_Paint: WALL vert_xx=" + vert_xx + ", start_xx=" + start_xx + ", start_yy=" + start_yy);

         ctx.fillStyle = "#000000";
         ctx.fillRect(start_xx, start_yy, 5, 30);
     }
     else if (value === "DOOR") {
         var start_xx = ((vert_xx + 1) * 30) - 2;
         ctx.fillStyle = "#00FF00";
         ctx.fillRect(start_xx, start_yy, 5, 30);
     }
     else if (value === "CHECKED") {
         var start_xx = ((vert_xx + 1) * 30) - 2;
         ctx.fillStyle = "#0000FF";
         ctx.fillRect(start_xx, start_yy, 5, 30);
     }
     else if (value === "SECRET") {
         var start_xx = ((vert_xx + 1) * 30) - 2;
         ctx.fillStyle = "#FF0000";
         ctx.fillRect(start_xx, start_yy, 5, 30);
     }
     /*********************
     else { //AIR
         //erase whatever is there 
         var start_xx = ((vert_xx + 1) * 30) - 2;
         ctx.clearRect(start_xx, start_yy, 5, 30);

         //vertical 1px black line
         start_xx = (vert_xx + 1) * 30;
         ctx.moveTo(start_xx, start_yy);
         ctx.lineTo(start_xx, start_yy + 30);
         ctx.strokeStyle = "#808080";
         ctx.stroke();
     }
     *************************/
}//LoadLines_Vertical_Paint

function handle_vertical_line(vert_xx, vert_yy) {

     const canvas = document.getElementById('myCanvas');
     const ctx = canvas.getContext('2d');

     var key = vert_xx + "," + vert_yy;
     var value = map_vertical.get(key);
     var start_yy = (19 - vert_yy)*30;

     //console.log("handle_vertical_line: value==" + value + " vert_xx==" + vert_xx + " vert_yy==" + vert_yy);

     if (value === "AIR") {
         map_vertical.set(vert_xx + "," + vert_yy, "WALL");

         var start_xx = ((vert_xx + 1) * 30) - 2;
         ctx.fillStyle = "#000000";
         ctx.fillRect(start_xx, start_yy, 5, 30);
     }
     else if (value === "WALL") {
         map_vertical.set(vert_xx + "," + vert_yy, "DOOR");

         var start_xx = ((vert_xx + 1) * 30) - 2;
         ctx.fillStyle = "#00FF00";
         ctx.fillRect(start_xx, start_yy, 5, 30);
     }
     else if (value === "DOOR") {
         map_vertical.set(vert_xx + "," + vert_yy, "CHECKED");

         var start_xx = ((vert_xx + 1) * 30) - 2;
         ctx.fillStyle = "#0000FF";
         ctx.fillRect(start_xx, start_yy, 5, 30);
     }
     else if (value === "CHECKED") {
         map_vertical.set(vert_xx + "," + vert_yy, "SECRET");

         var start_xx = ((vert_xx + 1) * 30) - 2;
         ctx.fillStyle = "#FF0000";
         ctx.fillRect(start_xx, start_yy, 5, 30);
     }
     else {
         map_vertical.set(vert_xx + "," + vert_yy, "AIR");

         //erase whatever is there 
         var start_xx = ((vert_xx + 1) * 30) - 2;
         ctx.clearRect(start_xx, start_yy, 5, 30);

         //vertical 1px black line
         start_xx = (vert_xx + 1) * 30;
         ctx.moveTo(start_xx, start_yy);
         ctx.lineTo(start_xx, start_yy + 30);
         ctx.strokeStyle = "#808080";
         ctx.stroke();
     }
}//handle_vertical_line

function LoadLines_Horizontal_Paint(horiz_xx, horiz_yy, value) {

     const canvas = document.getElementById('myCanvas');
     const ctx = canvas.getContext('2d');

     var start_xx = (horiz_xx + 1)*30;
     if (value === "WALL") {
         var start_yy = ((20 - horiz_yy) * 30) - 2;
         ctx.fillStyle = "#000000";
         ctx.fillRect(start_xx, start_yy, 30, 5);
     }
     else if (value === "DOOR") {
         var start_yy = ((20 - horiz_yy) * 30) - 2;
         ctx.fillStyle = "#00FF00";
         ctx.fillRect(start_xx, start_yy, 30, 5);
     }
     else if (value === "CHECKED") {
         var start_yy = ((20 - horiz_yy) * 30) - 2;
         ctx.fillStyle = "#0000FF";
         ctx.fillRect(start_xx, start_yy, 30, 5);
     }
     else if (value === "SECRET") {
         var start_yy = ((20 - horiz_yy) * 30) - 2;
         ctx.fillStyle = "#FF0000";
         ctx.fillRect(start_xx, start_yy, 30, 5);
     }
     /*************************************************
     else { //AIR
         //erase whatever is there
         var start_yy = ((20 - horiz_yy) * 30) - 2;
         ctx.clearRect(start_xx, start_yy, 30, 5);

         //horizontal line
         start_yy = (20 - horiz_yy) * 30;
         ctx.moveTo(start_xx, start_yy);
         ctx.lineTo(start_xx + 30, start_yy);
         ctx.strokeStyle = "#808080";
         ctx.stroke();
     }
     *******************************************************/
}//LoadLines_Horizontal_Paint

function handle_horizontal_line(horiz_xx, horiz_yy) {

     const canvas = document.getElementById('myCanvas');
     const ctx = canvas.getContext('2d');

     var key = horiz_xx + "," + horiz_yy;
     var value = map_horizontal.get(key);
     var start_xx = (horiz_xx + 1)*30;

     //console.log("handle_horizontal_line: value==" + value + " horiz_xx==" + horiz_xx + " horiz_yy==" + horiz_yy);

     if (value === "AIR") {
         map_horizontal.set(key, "WALL");
         var start_yy = ((20 - horiz_yy) * 30) - 2;
         ctx.fillStyle = "#000000";
         ctx.fillRect(start_xx, start_yy, 30, 5);
     }
     else if (value === "WALL") {
         map_horizontal.set(key, "DOOR");
         var start_yy = ((20 - horiz_yy) * 30) - 2;
         ctx.fillStyle = "#00FF00";
         ctx.fillRect(start_xx, start_yy, 30, 5);
     }
     else if (value === "DOOR") {
         map_horizontal.set(key, "CHECKED");
         var start_yy = ((20 - horiz_yy) * 30) - 2;
         ctx.fillStyle = "#0000FF";
         ctx.fillRect(start_xx, start_yy, 30, 5);
     }
     else if (value === "CHECKED") {
         map_horizontal.set(key, "SECRET");
         var start_yy = ((20 - horiz_yy) * 30) - 2;
         ctx.fillStyle = "#FF0000";
         ctx.fillRect(start_xx, start_yy, 30, 5);
     }
     else {
         map_horizontal.set(key, "AIR");

         //erase whatever is there
         var start_yy = ((20 - horiz_yy) * 30) - 2;
         ctx.clearRect(start_xx, start_yy, 30, 5);

         //horizontal line
         start_yy = (20 - horiz_yy) * 30;
         ctx.moveTo(start_xx, start_yy);
         ctx.lineTo(start_xx + 30, start_yy);
         ctx.strokeStyle = "#808080";
         ctx.stroke();
     }
}//handle_horizontal_line


// Define the function to run when the event occurs
function handleClick() {
     //offsetX and offsetY (relative to the top-left corner of the canvas)
     const xx = event.offsetX;
     const yy = event.offsetY;

     var vert_xx;
     var vert_yy;
     var horiz_xx;
     var horiz_yy;

     if (xx >= 29 && yy >= 0 && yy <= 600)
     {
          var vert_test = xx % 30;
          var horiz_test = yy % 30;
          if (vert_test==29 || vert_test<=1) //vertical line click test
          {
               vert_yy = yy / 30;
               vert_yy = 19 - vert_yy;
               vert_yy = Math.floor(vert_yy);
               vert_yy++;

               if (vert_test==29)
                    vert_xx = xx + 1;
               else
                    vert_xx = xx;
               vert_xx = vert_xx / 30;
               vert_xx--;
               vert_xx = Math.floor(vert_xx);

               handle_vertical_line(vert_xx, vert_yy);
          }
          else if (horiz_test==29 || horiz_test<=1) //horizontal line click test
          {
               horiz_xx = xx / 30;
               horiz_xx = Math.floor(horiz_xx);
               horiz_xx--;

               if (horiz_test==29)
                    horiz_yy = yy+1;
               else
                    horiz_yy = yy;
               horiz_yy = horiz_yy / 30;
               horiz_yy = 20 - Math.floor(horiz_yy);
               //console.log("xx==" + xx + " yy==" + yy);
               handle_horizontal_line(horiz_xx, horiz_yy);
          }
     }
}//handleClick

function DrawGrid() {

     const canvas = document.getElementById('myCanvas');
     const ctx = canvas.getContext('2d');

     // Clear the entire canvas
     ctx.clearRect(0, 0, canvas.width, canvas.height);

     for (ii=1; ii <= 20; ii++)
     {
          temp = 30 * ii;
     
          //vertical line
          ctx.moveTo(temp, 0);
          ctx.lineTo(temp, 630);
          ctx.strokeStyle = "#808080";
          ctx.stroke();
     
          //horizontal line
          ctx.moveTo(0, temp);
          ctx.lineTo(630, temp);
          ctx.strokeStyle = "#808080";
          ctx.stroke();
     }
     
     ctx.font = "26px Arial";
     for (num=0; num <= 19; num++)
     {
          // Y-axis numbers
          yy = (30 * num) + 26;
          ctx.fillText(19 - num, 0, yy);
     
          // X-axis numbers
          xx = (30 * num) + 30;
          ctx.fillText(num, xx, 626);
     }
}//DrawGrid

function OfflineInitialize() {
     var ii;
     var xx;
     var yy;
     var temp;
     var num;

     document.getElementById("myCanvas").addEventListener('click', handleClick);

     document.getElementById('fileInputID').addEventListener('change', (event) => {
  				const file = event.target.files[0];
  				if (!file) {
    					alert("fileInputID: Could not get file object!");
					return;
  				}

				const reader = new FileReader();
				reader.onload = (e) => {
					const fileContent = e.target.result;
					document.getElementById('textareaID').value = fileContent;
    					alert("fileInputID: File loaded successfully:", fileContent);
					document.getElementById('redrawfromtextareabuttonID').click();
				};

				reader.onerror = (e) => {
    					alert("fileInputID: Error reading file: ${e.target.error.name}");
				};

				// Read the file as plain text
				reader.readAsText(file);
     });

     DrawGrid();
     
     // Set map_horizontal
     var horiz_xx;
     var horiz_yy;
     for (horiz_xx = 0; horiz_xx <= 19; horiz_xx++)
     {
         for (horiz_yy = 0; horiz_yy <= 20; horiz_yy++)
             map_horizontal.set(horiz_xx + "," + horiz_yy, "AIR");
     }
     
     // Set map_vertical
     var vert_xx;
     var vert_yy;
     for (vert_xx = 0; vert_xx <= 20; vert_xx++)
     {
         for (vert_yy = 0; vert_yy <= 19; vert_yy++)
             map_vertical.set(vert_xx + "," + vert_yy, "AIR"); 
     }
}//OfflineInitialize


function RedrawMapsFromTextarea() {

        try {
		DrawGrid();
		
		var block = document.getElementById('textareaID').value.split("NOTES\n");
                document.getElementById('notesID').value = block[1];
                var myLines = block[0].trim().split('\n');

                //assume ii=0 is header line
                for (var ii=1; ii < myLines.length; ii++) 
                {
                     var trimstr = myLines[ii].trim();
                     if (trimstr.length > 0)
                     {
                           var temp = trimstr.split(',');
                           var vert_or_horiz = temp[0];
                           var xx = temp[1];
                           var yy = temp[2];
                           var line_type = temp[3];

			   if (vert_or_horiz === "VERTICAL")
                           {
                               map_vertical.set(xx + "," + yy, line_type);
                               LoadLines_Vertical_Paint(parseInt(xx,10), parseInt(yy,10), line_type);
                           }
			   else
                           {
                               map_horizontal.set(xx + "," + yy, line_type);
                               LoadLines_Horizontal_Paint(parseInt(xx,10), parseInt(yy,10), line_type);
                           }
                     }
                }//for

		DrawSpecialCharacters();

        }//try
        catch (err) {
                var errstr = "LoadFromTextarea ERROR = " + err;
                document.getElementById('textareaID').value = errstr;
        }
}//RedrawMapsFromTextarea


function MapsToString() {
	var bigstr = "";
	bigstr += "VERTICAL-OR-HORIZONTAL,XX,YY,TYPE\n";
	for (const key of map_vertical.keys()) {
                            var value = map_vertical.get(key);
                            var coords = key.split(",");
                            var xx = coords[0];
                            var yy = coords[1];
                            bigstr += "VERTICAL," + xx + "," + yy + "," + value + "\n";
        }
        for (const key of map_horizontal.keys()) {
                            var value = map_horizontal.get(key);
                            var coords = key.split(",");
                            var xx = coords[0];
                            var yy = coords[1];
                            bigstr += "HORIZONTAL," + xx + "," + yy + "," + value + "\n";
	}
	return bigstr;
}//MapsToString();


function PrintToTextarea() {

               document.getElementById('textareaID').value = "";
               var bigstr = MapsToString();
               document.getElementById('textareaID').value = bigstr;

}//PrintToTextarea


function SaveToTextFile() {

	//This function creates an in-memory representation of your data as a Blob, 
	//generates a temporary URL for it, and then forces a download when clicked.

	// Create a Blob object with the file content and specified MIME type
	var bigstr = MapsToString();
        bigstr += "NOTES\n";
        bigstr += document.getElementById('notesID').value;
	const blob = new Blob([bigstr], { type: 'text/plain;charset=utf-8' });

	// Create a temporary anchor element
    	const link = document.createElement('a');
    
	// Create a URL for the Blob object
	link.href = URL.createObjectURL(blob);
    
	// Set the download attribute with the desired filename
	link.download = "maps.txt";

	// Append link to body (necessary for some browsers)
	document.body.appendChild(link);

	// Programmatically click the link to trigger the download
	link.click();

	// Clean up by removing the link and revoking the object URL
	document.body.removeChild(link);
	URL.revokeObjectURL(link.href);
}//SaveToTextFile


OfflineInitialize();

</script>
</body>
</html>
